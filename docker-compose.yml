services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nicolas-goujon
    ports:
      - "${PORT:-3001}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: api
      dockerfile: Dockerfile
    container_name: nicolas-goujon-api
    volumes:
      # Persistance de la base SQLite et des fichiers stockés (survit aux rebuilds/redéploiements)
      - ./api/database:/app/database
      - ./api/storage/app:/app/storage/app
    environment:
      - APP_KEY=${APP_KEY}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-https://nicolas-goujon.fr}
      # Origine(s) autorisée(s) à appeler l'API (CORS). Sans cette variable,
      # Laravel retomberait sur son défaut permissif `*`.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://nicolas-goujon.fr,https://www.nicolas-goujon.fr}
      # Le site n'a pas de base de données : cache/session/queue sur fichier.
      # Le défaut Laravel (`database`) faisait échouer le limiteur de débit du
      # formulaire de contact — donc toute requête POST /api/contact — sur une
      # base SQLite absente (erreur 500 systématique).
      - CACHE_STORE=${CACHE_STORE:-file}
      - SESSION_DRIVER=${SESSION_DRIVER:-file}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-sync}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-mailhog}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - MAIL_USERNAME=${MAIL_USERNAME:-null}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-null}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-null}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - CONTACT_EMAIL_TO=${CONTACT_EMAIL_TO}
    restart: unless-stopped

  # MailHog : uniquement en dev (docker compose --profile dev up). En prod, ne pas lancer ; définir MAIL_* vers ton SMTP.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: nicolas-goujon-mailhog
    profiles:
      - dev
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface web
    restart: unless-stopped
