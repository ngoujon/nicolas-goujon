server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas divulguer la version du serveur dans l'en-tête `Server`
    # (le proxy nginx de l'hôte fait de même, cf. tools/nginx-site.conf.example).
    server_tokens off;

    # En-têtes de sécurité (voir nginx-security-headers.conf pour le détail).
    include /etc/nginx/snippets/security-headers.conf;

    # API Laravel (formulaire de contact).
    # Laravel pose déjà ses propres en-têtes de sécurité (middleware
    # SecurityHeaders) : on les retire de la réponse amont pour que nginx reste
    # la source unique. Deux en-têtes X-Frame-Options identiques sont en effet
    # considérés comme invalides par certains navigateurs, qui n'appliquent
    # alors aucune protection.
    location /api/ {
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Script d'initialisation du thème : nom de fichier sans hash, donc cache court
    # (contrairement aux bundles générés par le build, versionnés par leur nom).
    location = /theme-init.js {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1h;
    }

    # Cache des assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Routing React (SPA). Les routes réelles existent sur le disque sous forme
    # de pages pré-rendues (tools/prerender.js) ; toute autre URL est une vraie
    # page inexistante et doit répondre 404 (et non 200 avec la page d'accueil).
    # `$uri/index.html` plutôt que `$uri/` : ce dernier ferait répondre à nginx
    # une redirection 301 vers l'URL avec slash final (/contact -> /contact/),
    # incohérente avec les URL canoniques du site.
    location / {
        try_files $uri $uri/index.html @not_found;
    }

    location @not_found {
        return 404;
    }

    # Corps de la réponse 404 : page « 404 » pré-rendue, qui embarque le bundle
    # React et redevient interactive après hydratation.
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }

    # Sécurité : fichiers cachés (.git, .env...)
    location ~ /\. {
        deny all;
    }
}
