# =============================================================================
# En-têtes de sécurité HTTP (site statique React)
#
# ATTENTION : nginx n'hérite les directives `add_header` du niveau parent que
# si le niveau courant n'en déclare AUCUNE. Ce fichier doit donc être inclus
# dans CHAQUE bloc `location` qui possède ses propres `add_header`
# (ex. le cache des assets statiques), sinon ces réponses partent sans
# aucun en-tête de sécurité.
# =============================================================================

# Empêche le navigateur de deviner le type MIME (MIME confusion / sniffing).
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking : interdit l'inclusion du site dans une iframe.
# (doublon volontaire de `frame-ancestors` pour les navigateurs anciens)
add_header X-Frame-Options "DENY" always;

# Ne fuite pas l'URL complète vers les sites tiers.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Force HTTPS pendant 1 an (SSL stripping). L'en-tête traverse le proxy nginx
# de l'hôte, il est donc bien reçu par le navigateur sur https://nicolas-goujon.fr.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Coupe les API navigateur dont le site n'a aucun usage.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Isole le contexte de navigation (protection contre les attaques cross-origin).
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content-Security-Policy : principale défense contre les XSS.
#  - script-src 'self'          : aucun script inline autorisé (le script
#                                 d'initialisation du thème vit dans
#                                 /theme-init.js, cf. public/index.html).
#  - style-src 'unsafe-inline'  : requis par Emotion/MUI qui injecte ses styles.
#  - cdnjs.cloudflare.com       : Font Awesome (CSS + polices).
#  - frame-ancestors 'none'     : clickjacking.
#  - form-action / base-uri     : bloque le détournement de formulaire et de <base>.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
